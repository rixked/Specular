name: Release

# Publishes a GitHub Release when a version tag is pushed (SPEC.md §3.6):
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match `version` in pubspec.yaml. Assets have fixed names so
# the app can find them:
#   specular-X.Y.Z-android.apk
#   specular-X.Y.Z-windows-setup.exe
#   specular-X.Y.Z-linux-x64.tar.gz
#   SHA256SUMS

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.50.0
  # SHA-256 of the release signing certificate. A release APK signed with
  # any other key (for example the debug key) fails the build.
  RELEASE_CERT_SHA256: a2cbcc5995521772a6275263f9ba1aab921ef3628a82664d9da7f75071f5e1f0

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pubspec="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)"
          if [ "$tag" != "$pubspec" ]; then
            echo "::error::Tag v$tag does not match pubspec.yaml version $pubspec"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$tag"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          # Monotonic Android versionCode: 1.2.3 -> 10203.
          echo "build=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/specular-release.p12"
      - name: Check that Java can read the signing key
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Prints the certificate fingerprint or keytool's error message;
          # never the password.
          keytool -list -v -storetype pkcs12 \
            -keystore "$RUNNER_TEMP/specular-release.p12" \
            -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" \
            | grep -E "Alias|SHA256|Valid|Entry type" || {
              echo "::error::keytool could not read the signing key"
              keytool -list -storetype pkcs12 \
                -keystore "$RUNNER_TEMP/specular-release.p12" \
                -storepass:env STORE_PASSWORD 2>&1 | tail -5
              exit 1
            }
      - name: Build the signed APK
        env:
          SPECULAR_KEYSTORE_PATH: ${{ runner.temp }}/specular-release.p12
          SPECULAR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SPECULAR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          flutter pub get
          flutter build apk --release --build-name="$VERSION" --build-number="$BUILD"
      - name: Verify the release signature
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          grep -qi "certificate SHA-256 digest: $RELEASE_CERT_SHA256" certs.txt || {
            echo "::error::APK is not signed with the release key"
            exit 1
          }
          mkdir -p dist
          cp "$apk" "dist/specular-$VERSION-android.apk"
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/specular-release.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  windows:
    name: Windows installer
    runs-on: windows-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --build-name=$env:VERSION --build-number=$env:BUILD
      - name: Build the installer
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$pwd\build\windows\x64\runner\Release" "/DOutputDir=$pwd\dist" windows\installer\specular.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  linux:
    name: Linux tarball
    runs-on: ubuntu-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --build-name="$VERSION" --build-number="$BUILD"
      - run: |
          mkdir -p dist
          tar -czf "dist/specular-$VERSION-linux-x64.tar.gz" -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  publish:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: [version, android, windows, linux]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum specular-* > SHA256SUMS && cat SHA256SUMS
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Specular ${{ needs.version.outputs.version }}" \
            --generate-notes \
            --verify-tag
